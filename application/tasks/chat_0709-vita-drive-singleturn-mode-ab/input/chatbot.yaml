transport: external_http
runtimeDefaults:
  applicationId: vita_drive_assistant
  applicationContext: in_cabin_driving
  domain: automotive_ai
  maxTurns: 2
capabilities:
  - text_chat
connection:
  baseUrlEnv: VITA_ASSISTANT_API_URL
  baseUrl: http://127.0.0.1:3001
  healthPath: /health
  headers:
    # Secret stays in the environment; this file is committed.
    x-app-password: ${VITA_APP_PASSWORD}
    # Per-trial vehicle session. A shared session would let one trial observe
    # the vehicle state another trial mutated.
    x-vehicle-session: ${TRIAL_ID}
protocol:
  # The deployment ignores assistantProfileId sent beside a message -- proven by
  # two identical replies for profiles `normal` and `cheeky`. It only binds the
  # profile through its own endpoint, so the trial calls that first.
  sessionSetup:
    method: POST
    path: /api/persona/session
    body:
      assistantProfileId: ${case.state.assistant_profile_id}
  sendMessage:
    method: POST
    path: /api/chat
    sessionIdField: sessionId
    messageField: message
    titleField: ""
    botTypeField: ""
    staticBody: {}
    sessionBody:
      drivingContext: ${case.state.vehicle_state}
      vehicleState: ${case.state.vehicle_state}
  response:
    sessionIdField: sessionId
    replyField: assistantText
structuredExposure:
  # Needed to prove the requested profile actually took effect. Without it the
  # grid could report "no difference between profiles" when the real cause is
  # that no profile was ever switched on.
  fields:
    - key: assistantProfileId
      label: Profile SUT chạy
      selector: metadata.assistantProfileId
    - key: intent
      label: Intent
      selector: metadata.intent
artifacts:
  transcript: transcript.json
  applicationResult: application_result.json
  feedback: user_feedback.json

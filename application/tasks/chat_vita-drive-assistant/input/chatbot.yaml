transport: external_http
runtimeDefaults:
  applicationId: vita_drive_assistant
  applicationContext: in_cabin_driving
  domain: automotive_ai
  maxTurns: 6
capabilities:
  - text_chat
connection:
  baseUrlEnv: VITA_ASSISTANT_API_URL
  baseUrl: http://127.0.0.1:3001
  healthPath: /health
  headers:
    # Shared app password of the deployed VoiceLab build. Empty env -> header
    # omitted, which is what the unauthenticated local sidecar wants.
    x-app-password: ${VITA_APP_PASSWORD}
    # Vehicle state is keyed by this header. It MUST differ per trial: a shared
    # value lets one conversation observe cabin state another one changed.
    x-vehicle-session: ${TRIAL_ID}
protocol:
  sendMessage:
    method: POST
    path: /api/chat
    sessionIdField: sessionId
    messageField: message
    titleField: ""
    botTypeField: ""
    staticBody:
      drivingContext: driving
      intent: vehicle_control
  response:
    sessionIdField: sessionId
    replyField: assistantText
artifacts:
  transcript: transcript.json
  applicationResult: application_result.json
  feedback: user_feedback.json

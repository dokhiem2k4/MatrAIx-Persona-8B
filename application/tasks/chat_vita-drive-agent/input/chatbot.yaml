transport: external_http
runtimeDefaults:
  applicationId: vita_drive_agent
  applicationContext: in_cabin_autonomous_agent
  domain: automotive_ai
  maxTurns: 6
capabilities:
  - text_chat
connection:
  baseUrlEnv: VITA_ASSISTANT_API_URL
  baseUrl: http://127.0.0.1:3001
  healthPath: /health
  headers:
    x-app-password: "${VITA_APP_PASSWORD}"
    x-vehicle-session: "${TRIAL_ID}"
protocol:
  sendMessage:
    method: POST
    path: /api/agent/chat
    sessionIdField: sessionId
    messageField: message
    titleField: ""
    botTypeField: ""
    staticBody:
      drivingContext: driving
      intent: vehicle_control
  response:
    sessionIdField: sessionId
    replyField: assistantText
artifacts:
  transcript: transcript.json
  applicationResult: application_result.json
  feedback: user_feedback.json

schemaVersion: '1.0'
id: vita_utterance_cabin_occupancy_privacy
title: Vita — bối cảnh & câu mở đầu (cabin_occupancy_privacy)
description: Với mỗi tình huống dùng trợ lý xe VinFast VF9, persona tự dựng bối cảnh của mình rồi viết
  câu đầu tiên mở đầu hội thoại.
questions:
- id: q0
  prompt: '[Tình huống: xe đang chạy trên đường, trợ lý ở chế độ Yên tĩnh (trả lời ngắn gọn, ít chủ động)]

    Bạn đang muốn: Nhận biết người trên xe.

    Tham khảo — một người dùng khác đã nói: "Trên xe có khách, em nói nhỏ lại giúp tôi."


    Hãy dựng BỐI CẢNH của riêng bạn cho tình huống này: bạn đang đi đâu, vì việc gì, đang vội hay thong
    thả, có ai trên xe không, tâm trạng ra sao. Viết 1–2 câu, ngôi thứ nhất, gắn với đời sống thật của
    bạn.

    Không viết lời thoại ở đây. BẮT BUỘC viết BẰNG TIẾNG VIỆT.'
  type: free_text
  construct: occupant_awareness__scenario
  required: true
- id: q1
  prompt: '[Tình huống: xe đang chạy trên đường, trợ lý ở chế độ Yên tĩnh (trả lời ngắn gọn, ít chủ động)]

    Bạn đang muốn: Nhận biết người trên xe.

    Tham khảo — một người dùng khác đã nói: "Trên xe có khách, em nói nhỏ lại giúp tôi."


    Trong đúng bối cảnh bạn vừa mô tả, hãy viết CÂU ĐẦU TIÊN bạn nói ra với trợ lý Vita để mở đầu cuộc
    hội thoại. Đúng MỘT câu, bằng giọng của chính bạn — cách xưng hô, mức độ lịch sự và độ dài tự nhiên
    với bạn.

    Không giải thích, không ngoặc kép. BẮT BUỘC viết BẰNG TIẾNG VIỆT.'
  type: free_text
  construct: occupant_awareness__first_input
  required: true

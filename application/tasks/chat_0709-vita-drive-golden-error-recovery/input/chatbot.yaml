transport: external_http
runtimeDefaults:
  applicationId: vita_drive_assistant
  applicationContext: in_cabin_driving
  domain: automotive_ai
  maxTurns: 2
capabilities:
  - text_chat
connection:
  baseUrlEnv: VITA_ASSISTANT_API_URL
  baseUrl: http://127.0.0.1:3001
  healthPath: /health
  headers:
    # Secret stays in the environment; this file is committed.
    x-app-password: ${VITA_APP_PASSWORD}
    # Per-trial vehicle session. A shared session would let one trial observe
    # the vehicle state another trial mutated.
    x-vehicle-session: ${TRIAL_ID}
protocol:
  sendMessage:
    method: POST
    # /api/chat was removed on the deployment side (it now answers
    # "Cannot POST /api/chat"). Their own web app posts to /api/turn, which
    # returns the same shape: assistantText, metadata.*, vehicle.results.
    path: /api/turn
    # Their client sends conversationId, not sessionId.
    sessionIdField: conversationId
    messageField: message
    titleField: ""
    botTypeField: ""
    staticBody:
      drivingContext: driving
    sessionBody:
      dataAvailability: ${case.state.data_availability}
      vehicleSensor: ${case.state.vehicle_sensor}
      networkConnectivity: ${case.state.network_connectivity}
      serviceState: ${case.state.service_state}
      vehicleState: ${case.state.vehicle_state}
  response:
    sessionIdField: sessionId
    replyField: assistantText
structuredExposure:
  # The deployment exposes no `decision` field. What it does expose is a
  # metadata block of typed signals plus the vehicle tool results, and those
  # are enough to derive most of the five decision classes. Selectors are plain
  # dot-paths (structured_exposure.py:8), not JSONPath.
  fields:
    - key: intent
      label: Intent
      selector: metadata.intent
    - key: turnStatus
      label: Turn status
      selector: metadata.turnStatus
    - key: needsFollowUp
      label: Needs follow-up
      selector: metadata.needsFollowUp
    - key: needsConfirmation
      label: Needs confirmation
      selector: metadata.needsConfirmation
    - key: needsPermission
      label: Needs permission
      selector: metadata.needsPermission
    - key: riskLevel
      label: Risk level
      selector: metadata.riskLevel
    - key: assistantProfileId
      label: Assistant profile
      selector: metadata.assistantProfileId
    - key: toolResults
      label: Vehicle tool results
      selector: vehicle.results
      format: json
artifacts:
  transcript: transcript.json
  applicationResult: application_result.json
  feedback: user_feedback.json

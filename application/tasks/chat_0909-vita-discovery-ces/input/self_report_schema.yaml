artifactName: user_feedback.json
instructions: |
  Bạn vừa thử một tình huống với trợ lý Vita trên xe. Hãy chấm bốn nhận định
  dưới đây theo đúng cảm nhận của mình, thang 1 (rất không đồng ý) đến 7 (rất
  đồng ý).

  Bốn câu này là bộ đo CES lấy nguyên văn từ tài liệu nghiên cứu, không đổi
  chữ nào. Chấm như một người lái xe thật, không phải như người chấm điểm sản
  phẩm: nếu thấy bình thường thì cho điểm giữa, đừng nới tay cũng đừng khắt khe.

  QUAN TRỌNG — bạn chỉ NGHE Vita, không nhìn màn hình. Với câu CES-3, hãy chấm
  dựa trên những gì nghe được: câu trả lời dài hay ngắn, có bắt bạn phải nhớ
  nhiều thứ cùng lúc không, có hợp với lúc đang lái không.

  VIẾT TOÀN BỘ PHẦN TỰ LUẬN BẰNG TIẾNG VIỆT, và luôn dẫn lượt cụ thể
  ("ở lượt 2 Vita ..."). Nhận xét chung chung thì không sửa được gì.

fields:
  - key: ces1Effort
    prompt: Vita giúp tôi xử lý việc này một cách dễ dàng.
    kind: integer
    minimum: 1
    maximum: 7
    explanation:
      key: ces1Reason
      prompt: >-
        Vì sao đúng số điểm đó? Nếu bạn chấm từ 4 trở xuống, nói rõ điều gì
        khiến bạn thấy khó, dẫn lượt cụ thể.
  - key: ces2Information
    prompt: Thông tin Vita đưa ra đủ để tôi ra quyết định.
    kind: integer
    minimum: 1
    maximum: 7
    explanation:
      key: ces2Reason
      prompt: >-
        Thiếu hoặc thừa thông tin gì? Nếu chấm từ 4 trở xuống, nói rõ bạn còn
        cần biết thêm điều gì mới quyết định được.
  - key: ces3Presentation
    prompt: Cách Vita hiển thị trên màn hình lúc đó phù hợp với việc tôi đang lái xe.
    kind: integer
    minimum: 1
    maximum: 7
    explanation:
      key: ces3Reason
      prompt: >-
        Bạn chỉ nghe được, không nhìn màn hình — hãy chấm theo phần nghe và nói
        rõ vì sao. Nếu chấm từ 4 trở xuống, chỉ ra chỗ khiến bạn khó theo kịp.
  - key: ces4Attention
    prompt: Trong lúc đó tôi vẫn tập trung lái xe được bình thường.
    kind: integer
    minimum: 1
    maximum: 7
    explanation:
      key: ces4Reason
      prompt: >-
        Đây là câu về an toàn. Nếu chấm từ 4 trở xuống, bắt buộc nói rõ điều gì
        làm bạn phân tâm và ở lượt nào.
  - key: taskCompleted
    prompt: Cuối cùng bạn có làm xong việc mình định làm không?
    kind: enum
    choices: [yes, partially, no]
    explanation:
      key: taskCompletedNotes
      prompt: >-
        Nếu trả lời "partially", nói rõ phần nào xong và phần nào chưa. Dẫn lượt
        cụ thể.

  # Ba câu dưới là phần 3 của discussion guide (nhận biết vai trò, định vị,
  # tính cách). Trong tài liệu chúng được hỏi sau khi xem thông điệp và hình
  # ảnh đại diện; ở đây không có cả hai, nên căn cứ là chính cuộc vừa rồi.
  - key: assistantRole
    prompt: >-
      Sau lần này, theo bạn Vita là gì và nó giúp bạn được những việc gì?
    kind: string
  - key: moreThanCarControl
    prompt: >-
      Bạn thấy Vita chỉ là trợ lý điều khiển xe bằng giọng nói, hay là trợ lý
      hỗ trợ cuộc sống hằng ngày rộng hơn thế?
    kind: enum
    choices: [car_control_only, broader_daily_assistant, unclear]
    explanation:
      key: moreThanCarControlReason
      prompt: Điều gì trong lần này làm bạn nghĩ vậy?
  - key: threeWords
    prompt: >-
      Dùng đúng BA TỪ (hoặc ba cụm ngắn) để mô tả Vita, cách nhau bằng dấu phẩy.
      Tả đúng cảm nhận sau lần này, kể cả khi đó là từ không hay.
    kind: string
    explanation:
      key: threeWordsReason
      prompt: Vì sao ba từ đó? Dẫn lượt cụ thể khiến bạn thấy vậy.
  - key: wouldTrust
    prompt: Sau lần này, bạn có tin tưởng giao việc tương tự cho Vita nữa không?
    kind: enum
    choices: [yes, partially, no]
    explanation:
      key: wouldTrustReason
      prompt: Nếu "partially", nói rõ việc nào bạn giao được và việc nào chưa.

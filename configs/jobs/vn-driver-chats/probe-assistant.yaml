# One-trial calibration probe: measures real tokens and cost for a vn-driver
# persona against a 6-turn chat task, so the full-run estimate is measured
# rather than guessed.
job_name: vn-drv-probe-assistant
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 1
quiet: false
environment:
  type: host
  delete: true
agents:
- name: persona-user-sim
  model_name: openrouter/google/gemini-3.5-flash-lite
  kwargs:
    persona_path: persona/datasets/vn-drivers/persona_vn-drv-011.yaml
    model_info:
      max_input_tokens: 128000
      max_output_tokens: 16384
tasks:
- path: application/tasks/chat_vita-drive-assistant
